name: Verify MineVault web beta
on:
  push:
    branches: [beta/capture-first-v0-1]
    paths: ['app/**', 'components/**', 'lib/**', 'tests/**', 'package*.json', '.github/workflows/minevault-web.yml']
  pull_request:
    paths: ['app/**', 'components/**', 'lib/**', 'tests/**', 'package*.json', '.github/workflows/minevault-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright test tests/capture-import.spec.ts
      - run: npm run build
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Exercise MineVault journal in a real browser
        run: |
          python3 -m http.server 3000 --directory out > /tmp/minevault-web.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/ > /dev/null || { cat /tmp/minevault-web.log; exit 1; }
          npx playwright test tests/demo.spec.ts tests/capture-import-ui.spec.ts

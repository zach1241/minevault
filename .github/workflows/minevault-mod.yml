name: Build MineVault Fabric beta
on:
  push:
    branches: [beta/capture-first-v0-1]
    paths: ['minecraft-mod/**', '.github/workflows/minevault-mod.yml']
  pull_request:
    paths: ['minecraft-mod/**', '.github/workflows/minevault-mod.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Fabric beta
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: minevault-fabric-1.21.1-beta
          path: minecraft-mod/build/libs/minevault-fabric-0.1.0-beta.jar
          if-no-files-found: error

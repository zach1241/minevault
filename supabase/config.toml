project_id = "minevault"
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
port = 55323
[local_smtp]
enabled = true
port = 55324
[storage]
enabled = true
file_size_limit = "10MiB"
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**", "http://127.0.0.1:3000/**", "http://127.0.0.1:3001/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = false
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
[edge_runtime]
enabled = false
[analytics]
enabled = false
